# Repeated into every location that sets its own add_header, because nginx drops
# ALL inherited add_header directives in any location that declares one of its
# own. Install to /etc/nginx/snippets/index-security.conf. See the server block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
