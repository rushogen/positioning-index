#:schema node_modules/wrangler/config-schema.json
name = "positioning-index"
main = "src/index.js"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Static assets are served by Cloudflare's asset pipeline before the Worker
# runs. They are free and unmetered, and requests they serve do not count
# against the 100k/day Worker request quota, which is why the public page is
# plain HTML plus a small fetch() rather than server-rendered.
[assets]
directory = "./public"
binding = "ASSETS"
# The Worker gets first refusal on the request so /api/* is routed in code,
# and anything not matching an asset falls through to the SPA shell.
run_worker_first = ["/api/*", "/crawler", "/crawler.txt", "/robots.txt"]

[[d1_databases]]
binding = "DB"
database_name = "positioning_index"
# Replace with the id printed by: wrangler d1 create positioning_index
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
# Two of the five Cron Triggers the free plan allows.
#
#   */5  one tick: claim the single most overdue target, fetch it, parse it,
#        diff it, store it. 288 ticks a day against ~120 targets sweeps the
#        whole index in roughly ten hours with slack for retries, and makes
#        "one request per host per invocation" true by construction rather
#        than by convention.
#
#   00:05 daily bookkeeping: close yesterday's run, open today's.
#
# Deliberately NOT one cron that loops over sixty companies. Free-plan Workers
# get 10ms of CPU per invocation and these pages are 300kB-1.5MB; a loop would
# be killed partway through, leaving the index silently half-updated, which is
# the exact failure mode this project is built to avoid.
crons = ["*/5 * * * *", "5 0 * * *"]

[vars]
# Lets the scheduled handler tell the two crons apart.
DAILY_CRON = "5 0 * * *"

[observability]
enabled = true
head_sampling_rate = 1

# --- Notes on staying inside the free plan ---------------------------------
#
# Requests   100k/day. Static assets do not count. The JSON API is cached at
#            the edge for 15 minutes (s-maxage=900), so a burst of traffic
#            mostly never reaches the Worker.
# CPU        10ms per invocation. The fetch handler does D1 reads and JSON
#            serialisation only. Extraction happens in the scheduled handler,
#            measured at ~5ms warm on a 1.2MB page (npm run probe).
# D1         5GB storage, 100k rows written/day. A full sweep writes roughly
#            1.5k rows. See the header of schema.sql for the arithmetic.
# Crons      5 allowed, 2 used.
#
# The free plan has no payment method attached and cannot bill. It fails closed:
# if the index outgrows these limits it stops, it does not quietly generate an
# invoice. That is a deliberate choice for a side project that must be able to
# run unattended.
